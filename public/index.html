<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CallTrove</title>
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">
          <svg viewBox="19 3 64 123" width="18" height="35" aria-hidden="true">
            <path class="mark-lock-stroke" d="M38 78 V62 A12 12 0 0 1 62 62 V78" />
            <path class="mark-lock-body" d="M34 78 H66 L74 92 V114 L50 126 L26 114 V92 Z" />
            <path class="mark-keyhole" d="M50 96 L57 102 L54 112 H46 L43 102 Z" />
            <path class="mark-handset" transform="translate(14 4) scale(3.1)" d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z" />
          </svg>
        </div>
        <div class="brand-name">Call<span class="brand-name-accent">Trove</span></div>
        <button type="button" id="mobile-nav-toggle" class="mobile-nav-toggle" aria-label="Menu">&#9776;</button>
      </div>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Search contacts by name or phone..." autocomplete="off" />
        <ul id="search-results" class="search-results" hidden></ul>
      </div>
      <div id="account-switcher-wrap" class="account-switcher-wrap" hidden>
        <span class="account-switcher-label">Account</span>
        <select id="account-switcher" class="account-switcher"></select>
      </div>
      <nav class="sidebar-nav">
        <a href="/" class="nav-link active">Dashboard</a>
        <a href="/contacts.html" class="nav-link">Contacts</a>
        <a href="/settings.html" class="nav-link">Settings</a>
      </nav>
      <div id="admin-nav" class="admin-nav" hidden>
        <span class="view-as-label">Viewing calls for</span>
        <select id="view-as" class="view-as"></select>
      </div>
    </aside>
    <main class="content">
      <div id="cancellation-banner" class="cancellation-banner" hidden></div>
      <div class="content-header">
        <span class="page-title">Dashboard</span>
        <div class="content-header-right">
          <button type="button" id="theme-toggle" class="theme-toggle">Dark mode</button>
          <div id="session-bar" class="session-bar"></div>
        </div>
      </div>

      <div id="contact-context" class="contact-context" hidden>
        <button type="button" id="back-to-contacts-btn" class="back-btn"></button>
        <span id="contact-context-name" class="contact-context-name"></span>
      </div>

      <div class="stat-grid" id="stat-grid"></div>

      <div class="filter-bar">
        <div class="filter-bar-left">
          <div class="filter-dates">
            <div class="preset-group">
              <button type="button" class="preset-btn" data-preset="today">Today</button>
              <button type="button" class="preset-btn" data-preset="week">This week</button>
              <button type="button" class="preset-btn" data-preset="month">This month</button>
              <button type="button" class="preset-btn" data-preset="year">This year</button>
              <button type="button" class="preset-btn" data-preset="all">All time</button>
            </div>
            <label>From <input type="date" id="date-from" /></label>
            <label>To <input type="date" id="date-to" /></label>
          </div>
          <div class="filter-divider"></div>
          <label class="filter-select-label">Direction
            <select id="direction-select">
              <option value="">All</option>
              <option value="inbound">Inbound</option>
              <option value="outbound">Outbound</option>
            </select>
          </label>
          <label class="filter-select-label">Outcome
            <select id="disposition-select">
              <option value="">All</option>
            </select>
          </label>
        </div>
        <div id="results-summary" class="results-summary"></div>
      </div>

      <table class="calls-table">
        <colgroup>
          <col width="18%" />
          <col width="13%" />
          <col width="9%" />
          <col width="8%" />
          <col width="12%" />
          <col width="11%" />
          <col width="18%" />
          <col width="11%" />
        </colgroup>
        <thead>
          <tr>
            <th>Contact</th>
            <th>Date/Time</th>
            <th>Direction</th>
            <th>Duration</th>
            <th>Handled by</th>
            <th>Outcome</th>
            <th>Recording</th>
            <th>Transcript</th>
          </tr>
        </thead>
        <tbody id="call-rows"></tbody>
      </table>

      <div class="pagination">
        <label class="page-size-label">Per page
          <select id="page-size-select">
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </label>
        <span class="pagination-divider">&middot;</span>
        <button type="button" id="prev-page-btn">&larr; Prev</button>
        <span id="page-indicator"></span>
        <button type="button" id="next-page-btn">Next &rarr;</button>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
