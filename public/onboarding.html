<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CallTrove — Finish setting up</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <script src="theme.js"></script>
</head>
<body>
  <div class="login-page">
    <button type="button" id="theme-toggle" class="theme-toggle theme-toggle-corner">Dark mode</button>
    <div class="login-card onboarding-card" id="onboarding-card">
      <div class="login-brand">
        <div class="brand-mark">
          <svg viewBox="19 3 64 123" width="23" height="44" aria-hidden="true">
            <path class="mark-lock-stroke" d="M38 78 V62 A12 12 0 0 1 62 62 V78" />
            <path class="mark-lock-body" d="M34 78 H66 L74 92 V114 L50 126 L26 114 V92 Z" />
            <path class="mark-keyhole" d="M50 96 L57 102 L54 112 H46 L43 102 Z" />
            <path class="mark-handset" transform="translate(14 4) scale(3.1)" d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z" />
          </svg>
        </div>
        <div class="brand-name">Call<span class="brand-name-accent">Trove</span></div>
      </div>

      <div id="wizard-steps" class="wizard-steps" aria-label="Sign-up progress"></div>

      <section id="onboarding-baa" hidden>
        <h1 class="onboarding-title">Business Associate Agreement</h1>
        <p class="settings-note">You said you'll store health information. Read and accept the agreement below to continue.</p>
        <pre id="baa-text" class="baa-text-box"></pre>
        <form id="baa-accept-form" class="admin-form">
          <label>Full legal name <input type="text" id="baa-full-name" required autocomplete="name" /></label>
          <label>Title <input type="text" id="baa-title" required autocomplete="organization-title" /></label>
          <label class="onboarding-agree"><input type="checkbox" id="baa-agree-checkbox" required /> I have read and agree to this agreement on behalf of my company.</label>
          <button type="submit" id="baa-accept-btn">I Agree &amp; Accept</button>
          <span id="baa-accept-error" class="login-error" hidden></span>
        </form>
      </section>

      <section id="onboarding-billing" hidden>
        <div class="checkout-layout">
          <aside class="checkout-summary">
            <p class="checkout-eyebrow" id="plan-eyebrow">Your plan</p>
            <h1 class="onboarding-title" id="plan-name"></h1>
            <p class="checkout-price"><span id="onboarding-price"></span></p>
            <ul class="checkout-points" id="plan-points"></ul>
            <p id="subscription-status" class="settings-note"></p>
          </aside>
          <div class="checkout-pane">
            <div id="checkout-frame" class="checkout-frame"></div>
            <p id="checkout-fallback" class="settings-note" hidden></p>
          </div>
        </div>
      </section>
    </div>
  </div>
  <script src="wizard-steps.js"></script>
  <script src="onboarding.js"></script>
  <script src="password-toggle.js"></script>
</body>
</html>
